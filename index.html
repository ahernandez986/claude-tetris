<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records hidden">
          <p id="new-record-msg" class="new-record hidden">¡Nuevo récord!</p>
          <div id="name-form" class="name-form hidden">
            <input id="player-name" type="text" maxlength="12" value="JUGADOR" autocomplete="off" spellcheck="false" />
            <button id="save-record-btn" class="btn">Guardar</button>
          </div>
          <table id="gameover-records-table" class="records-table"></table>
          <p class="records-stats">Mejor combo: <span id="gameover-best-combo">0</span> · Líneas máximas: <span id="gameover-max-lines">0</span></p>
          <button id="gameover-reset-btn" class="btn-link">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <div class="records">
          <span class="label">RÉCORDS</span>
          <table id="start-records-table" class="records-table"></table>
          <p class="records-stats">Mejor combo: <span id="start-best-combo">0</span> · Líneas máximas: <span id="start-max-lines">0</span></p>
          <button id="start-reset-btn" class="btn-link">Borrar récords</button>
        </div>
        <button id="play-btn" class="btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
